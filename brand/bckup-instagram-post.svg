<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" font-family="Helvetica, Arial, sans-serif">
  <!-- violet field -->
  <rect width="1080" height="1080" fill="#9b6bff" />

  <!-- patterned woman silhouette (profile facing left) -->
