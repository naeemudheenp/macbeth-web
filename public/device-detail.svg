<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700" role="img" aria-label="Detail view of the Macbeth device, ports and texture">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe7d9"/>
      <stop offset="1" stop-color="#e2d6bf"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#372d22"/>
      <stop offset="0.5" stop-color="#241d15"/>
      <stop offset="1" stop-color="#171109"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="800" height="700" fill="url(#bg2)"/>

  <!-- shadow -->
  <ellipse cx="400" cy="560" rx="230" ry="30" fill="#000" opacity="0.14"/>

  <!-- device standing, three-quarter -->
  <g>
    <rect x="210" y="150" width="380" height="400" rx="26" fill="url(#metal)"/>
    <rect x="210" y="150" width="380" height="400" rx="26" fill="url(#sheen)"/>

    <!-- anodised micro-texture: faint horizontal grooves -->
    <g stroke="#ede4d5" stroke-opacity="0.05" stroke-width="1">
      <line x1="240" y1="210" x2="560" y2="210"/>
      <line x1="240" y1="230" x2="560" y2="230"/>
      <line x1="240" y1="250" x2="560" y2="250"/>
      <line x1="240" y1="270" x2="560" y2="270"/>
    </g>

    <!-- wordmark -->
    <text x="400" y="345" text-anchor="middle" font-family="Georgia, serif" font-size="40" letter-spacing="1.5" fill="#ede4d5" opacity="0.95">Macbeth<tspan fill="#d98a4e">.</tspan></text>
    <text x="400" y="378" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" letter-spacing="4" fill="#ede4d5" opacity="0.4">PRIVATE MEMORY CLOUD</text>

    <!-- pairing code square -->
    <g transform="translate(355,408)">
      <rect width="90" height="90" rx="8" fill="#ede4d5"/>
      <g fill="#241d15">
        <rect x="12" y="12" width="22" height="22"/>
        <rect x="56" y="12" width="22" height="22"/>
        <rect x="12" y="56" width="22" height="22"/>
        <rect x="42" y="42" width="10" height="10"/>
        <rect x="58" y="56" width="10" height="10"/>
        <rect x="68" y="66" width="10" height="10"/>
        <rect x="56" y="42" width="8" height="8"/>
      </g>
    </g>

    <!-- ports along the bottom edge -->
    <g>
      <rect x="252" y="520" width="58" height="14" rx="7" fill="#0f0b06"/>
      <rect x="324" y="522" width="34" height="10" rx="5" fill="#0f0b06"/>
      <circle cx="392" cy="527" r="7" fill="#0f0b06"/>
    </g>

    <!-- status light -->
    <circle cx="262" cy="190" r="6" fill="#b85c38"/>
    <circle cx="262" cy="190" r="11" fill="#b85c38" opacity="0.25"/>
  </g>
</svg>
