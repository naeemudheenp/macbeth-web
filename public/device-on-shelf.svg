<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="The Macbeth device resting on a bookshelf">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe7d9"/>
      <stop offset="1" stop-color="#e6dcc9"/>
    </linearGradient>
    <linearGradient id="dev" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c241b"/>
      <stop offset="1" stop-color="#1c1610"/>
    </linearGradient>
    <linearGradient id="topface" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3025"/>
      <stop offset="1" stop-color="#2a221a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#wall)"/>

  <!-- soft window light -->
  <rect x="470" y="40" width="300" height="300" fill="#f6f1e8" opacity="0.35"/>

  <!-- shelf -->
  <rect x="0" y="430" width="800" height="14" fill="#cdbfa4"/>
  <rect x="0" y="444" width="800" height="56" fill="#b9a684"/>
  <rect x="0" y="444" width="800" height="8" fill="#a4906c" opacity="0.6"/>

  <!-- books, left -->
  <g>
    <rect x="60" y="300" width="26" height="130" fill="#9a5a3c"/>
    <rect x="90" y="288" width="22" height="142" fill="#7d7a5e"/>
    <rect x="116" y="312" width="30" height="118" fill="#b85c38"/>
    <rect x="150" y="296" width="20" height="134" fill="#4d4636"/>
    <rect x="174" y="320" width="34" height="110" fill="#caa06a"/>
  </g>

  <!-- a small leaning frame, right -->
  <g>
    <rect x="600" y="296" width="120" height="134" fill="#d8c9ac" transform="rotate(4 660 363)"/>
    <rect x="612" y="308" width="96" height="110" fill="#cbb88f" transform="rotate(4 660 363)"/>
  </g>

  <!-- the device -->
  <g>
    <!-- shadow -->
    <ellipse cx="392" cy="432" rx="150" ry="16" fill="#000" opacity="0.16"/>
    <!-- body -->
    <rect x="280" y="300" width="220" height="130" rx="14" fill="url(#dev)"/>
    <!-- top bevel -->
    <rect x="280" y="300" width="220" height="22" rx="11" fill="url(#topface)"/>
    <!-- engraved wordmark -->
    <text x="390" y="375" text-anchor="middle" font-family="Georgia, serif" font-size="26" letter-spacing="1" fill="#ede4d5" opacity="0.92">Macbeth<tspan fill="#b85c38">.</tspan></text>
    <!-- status dot -->
    <circle cx="324" cy="345" r="5" fill="#b85c38"/>
    <circle cx="324" cy="345" r="9" fill="#b85c38" opacity="0.25"/>
    <!-- vent lines -->
    <g stroke="#000" stroke-opacity="0.25" stroke-width="2">
      <line x1="320" y1="405" x2="460" y2="405"/>
      <line x1="320" y1="413" x2="460" y2="413"/>
    </g>
  </g>
</svg>
